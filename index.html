<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kad Hari Lahir untuk Kakak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #fdeff9 0%, #f8d7e3 100%);
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        /* confetti / bunga halus */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #f8a1b0;
            opacity: 0.35;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: float 12s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        .confetti:nth-child(1) { left: 5%; top: 15%; background: #f6c1d0; width: 24px; height: 24px; animation-duration: 18s; }
        .confetti:nth-child(2) { left: 85%; top: 70%; background: #e5b0c0; width: 30px; height: 30px; animation-duration: 22s; }
        .confetti:nth-child(3) { left: 20%; top: 80%; background: #fad0da; width: 18px; height: 18px; animation-duration: 14s; }
        .confetti:nth-child(4) { left: 70%; top: 10%; background: #dba5b5; width: 40px; height: 40px; animation-duration: 26s; }
        .confetti:nth-child(5) { left: 45%; top: 5%; background: #ffd9e2; width: 20px; height: 20px; animation-duration: 16s; }
        .confetti:nth-child(6) { left: 92%; top: 30%; background: #f3c1cf; width: 22px; height: 22px; animation-duration: 20s; }
        .confetti:nth-child(7) { left: 10%; top: 45%; background: #eec9d5; width: 16px; height: 16px; animation-duration: 15s; }
        .confetti:nth-child(8) { left: 60%; top: 90%; background: #ffc1d0; width: 28px; height: 28px; animation-duration: 24s; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-25px) rotate(15deg) scale(1.1); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        .card {
            position: relative;
            background: rgba(255, 245, 248, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 48px 48px 48px 48px;
            box-shadow: 0 25px 40px -12px rgba(150, 60, 80, 0.35),
                        0 0 0 2px rgba(255, 220, 230, 0.7) inset,
                        0 0 0 4px rgba(255, 240, 245, 0.6);
            padding: 2.8rem 2.5rem;
            max-width: 650px;
            width: 100%;
            text-align: center;
            z-index: 10;
            transition: transform 0.2s ease;
            animation: cardGlow 3s infinite alternate;
        }

        @keyframes cardGlow {
            from { box-shadow: 0 25px 40px -12px rgba(180, 80, 100, 0.3), 0 0 0 2px #ffe2ec inset, 0 0 0 4px #ffeef4; }
            to { box-shadow: 0 30px 50px -10px rgba(210, 100, 130, 0.5), 0 0 0 3px #ffd9e6 inset, 0 0 0 5px #ffeef6; }
        }

        .cake-icon {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 0.25rem;
            filter: drop-shadow(0 8px 12px rgba(200, 100, 120, 0.4));
            animation: bounce 2s infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #b3415c;
            text-shadow: 0 4px 8px rgba(255, 200, 210, 0.8);
            letter-spacing: -0.5px;
            margin-top: 0.2rem;
            line-height: 1.2;
            font-family: 'Poppins', 'Segoe UI', cursive;
            word-break: break-word;
        }

        .name {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c7506e, #d96b8a, #b33b5b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 6px 15px rgba(220, 140, 160, 0.4);
            margin: 0.5rem 0 0.2rem;
            line-height: 1.2;
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        .message {
            font-size: 1.25rem;
            color: #6b3a4a;
            background: #fff6fa;
            padding: 1.5rem 1.8rem;
            border-radius: 60px;
            margin: 1.8rem 0 2rem;
            line-height: 1.6;
            box-shadow: 0 8px 15px rgba(200, 130, 150, 0.15), inset 0 1px 4px white;
            border: 1px solid #ffe2ed;
            font-weight: 500;
            transition: all 0.2s;
            position: relative;
        }

        .message::before {
            content: "“";
            font-size: 4rem;
            position: absolute;
            left: 12px;
            top: -8px;
            color: #f8c8d6;
            opacity: 0.5;
            font-family: serif;
        }

        .message::after {
            content: "”";
            font-size: 4rem;
            position: absolute;
            right: 12px;
            bottom: -30px;
            color: #f8c8d6;
            opacity: 0.5;
            font-family: serif;
        }

        .btn-play {
            background: linear-gradient(145deg, #e987a5, #c95f7b);
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 1.2rem 2.8rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            cursor: pointer;
            box-shadow: 0 16px 24px -8px #b34f6b, 0 0 0 2px #ffeef4 inset;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            margin-top: 0.2rem;
            font-family: inherit;
            width: auto;
            min-width: 240px;
            border: 1px solid #ffc1d2;
        }

        .btn-play:hover {
            background: linear-gradient(145deg, #db7897, #b9516d);
            box-shadow: 0 20px 28px -8px #a3445e, 0 0 0 3px #ffe2ec inset;
            transform: scale(1.02);
        }

        .btn-play:active {
            transform: scale(0.98);
            box-shadow: 0 8px 16px -4px #a3445e;
        }

        .btn-play span {
            font-size: 1.8rem;
            line-height: 1;
        }

        .music-notation {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 8px;
            color: #d46b88;
            opacity: 0.8;
            font-size: 1.6rem;
            letter-spacing: 8px;
        }

        .music-notation span {
            animation: noteBounce 1.4s infinite;
        }

        .music-notation span:nth-child(2) { animation-delay: 0.2s; }
        .music-notation span:nth-child(3) { animation-delay: 0.4s; }
        .music-notation span:nth-child(4) { animation-delay: 0.6s; }
        .music-notation span:nth-child(5) { animation-delay: 0.8s; }

        @keyframes noteBounce {
            0%, 100% { transform: translateY(0); opacity: 0.7; }
            50% { transform: translateY(-10px); opacity: 1; }
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #bb7b8f;
            letter-spacing: 0.3px;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 36px;
            }
            h1 {
                font-size: 2.2rem;
            }
            .name {
                font-size: 2.8rem;
            }
            .message {
                font-size: 1.1rem;
                padding: 1.2rem 1rem;
            }
            .btn-play {
                font-size: 1.2rem;
                padding: 1rem 1.5rem;
                min-width: 200px;
            }
            .cake-icon {
                font-size: 3.8rem;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.8rem 1rem;
            }
            .name {
                font-size: 2.2rem;
            }
            .btn-play {
                font-size: 1rem;
                padding: 0.9rem 1.2rem;
                gap: 8px;
            }
            .message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- confetti background -->
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="card">
        <div class="cake-icon">🎂</div>
        <h1>Selamat Hari Lahir</h1>
        <div class="name">Kakak Tersayang</div>
        
        <div class="music-notation">
            <span>♪</span> <span>♫</span> <span>♪</span> <span>♩</span> <span>♬</span>
        </div>

        <div class="message">
            Semoga panjang umur, murah rezeki, <br>
            dan sentiasa bahagia bersama keluarga. <br>
            Terima kasih kerana menjadi kakak terbaik! 💖
        </div>

        <!-- BUTANG MAIN LAGU -->
        <button class="btn-play" id="playBtn" aria-label="Main lagu Happy Birthday">
            <span>🎵</span> Main Lagu <span>🎶</span>
        </button>

        <div class="footer">
            — dengan penuh kasih sayang, adik — 
        </div>
    </div>

    <!-- Audio: Melodi Happy Birthday menggunakan Web Audio API (tiada fail luaran) -->
    <script>
        (function() {
            // Gunakan Web Audio API untuk menjana melodi "Happy Birthday" (versi ringkas & merdu)
            const playBtn = document.getElementById('playBtn');

            // Not muzik: frekuensi (Hz) untuk melodi happy birthday (dalam C major, versi mudah)
            // G G A G C B | G G A G D C | G G G' E C B A | F F E C D C
            // Kita ringkaskan supaya sedap didengar (oktaf tengah)
            const notes = [
                // "Happy birthday to you" (bar 1)
                { note: 'G4', dur: 0.3 }, { note: 'G4', dur: 0.15 }, { note: 'A4', dur: 0.5 }, { note: 'G4', dur: 0.5 }, { note: 'C5', dur: 0.5 }, { note: 'B4', dur: 0.9 },
                // "Happy birthday to you" (bar 2)
                { note: 'G4', dur: 0.3 }, { note: 'G4', dur: 0.15 }, { note: 'A4', dur: 0.5 }, { note: 'G4', dur: 0.5 }, { note: 'D5', dur: 0.5 }, { note: 'C5', dur: 0.9 },
                // "Happy birthday dear Kakak" (bar 3)
                { note: 'G4', dur: 0.3 }, { note: 'G4', dur: 0.15 }, { note: 'G5', dur: 0.5 }, { note: 'E5', dur: 0.5 }, { note: 'C5', dur: 0.5 }, { note: 'B4', dur: 0.5 }, { note: 'A4', dur: 0.9 },
                // "Happy birthday to you" (bar 4)
                { note: 'F5', dur: 0.3 }, { note: 'F5', dur: 0.15 }, { note: 'E5', dur: 0.5 }, { note: 'C5', dur: 0.5 }, { note: 'D5', dur: 0.5 }, { note: 'C5', dur: 1.0 }
            ];

            // Pemetaan frekuensi untuk not (oktaf 4 dan 5)
            const freqMap = {
                'G4': 392.00,
                'A4': 440.00,
                'B4': 493.88,
                'C5': 523.25,
                'D5': 587.33,
                'E5': 659.25,
                'F5': 698.46,
                'G5': 783.99
            };

            let audioCtx = null;
            let isPlaying = false;
            let stopTimeout = null;
            let currentOscillators = []; // untuk hentikan semua jika perlu

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            // main melodi
            function playMelody() {
                if (isPlaying) return; // elak double click
                const ctx = initAudio();
                if (!ctx) return;

                isPlaying = true;
                playBtn.disabled = true;
                playBtn.style.opacity = '0.8';
                playBtn.innerHTML = '<span>🎶</span> Memainkan... <span>🎵</span>';

                // kira jumlah masa
                let totalDuration = notes.reduce((acc, n) => acc + n.dur, 0);
                // tambah sedikit rehat
                totalDuration += 0.3;

                // jadualkan setiap not
                let startTime = ctx.currentTime + 0.15; // sedikit delay untuk kesediaan

                // untuk kesan legato / overlap sedikit, kita mainkan not dengan envelope lembut
                notes.forEach((item, index) => {
                    const freq = freqMap[item.note];
                    if (!freq) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine'; // lembut dan jelas
                    osc.frequency.value = freq;

                    // sedikit modulasi halus untuk natural
                    const now = startTime;
                    const dur = item.dur;

                    // Attack & release lembut supaya tidak click
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.25, now + 0.03); // attack cepat
                    gain.gain.setValueAtTime(0.25, now + dur - 0.05);
                    gain.gain.linearRampToValueAtTime(0, now + dur);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + dur + 0.05);

                    // simpan untuk rujukan (tidak perlu hentikan manual sebab stop() dah dijadualkan)
                    // tapi kita simpan untuk berjaga-jaga
                    currentOscillators.push(osc);

                    // majukan masa
                    startTime += dur;
                });

                // selepas melodi habis, reset butang
                stopTimeout = setTimeout(() => {
                    isPlaying = false;
                    playBtn.disabled = false;
                    playBtn.style.opacity = '1';
                    playBtn.innerHTML = '<span>🎵</span> Main Lagu <span>🎶</span>';
                    currentOscillators = [];
                }, totalDuration * 1000 + 200);
            }

            // Hentikan semua jika perlu (tidak digunakan tapi bagus untuk kebersihan)
            function stopAll() {
                if (stopTimeout) {
                    clearTimeout(stopTimeout);
                    stopTimeout = null;
                }
                currentOscillators.forEach(osc => {
                    try { osc.stop(); } catch (e) {}
                });
                currentOscillators = [];
                isPlaying = false;
                playBtn.disabled = false;
                playBtn.style.opacity = '1';
                playBtn.innerHTML = '<span>🎵</span> Main Lagu <span>🎶</span>';
            }

            // tambah event listener
            playBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (isPlaying) {
                    // jika sedang main, hentikan dan mula semula? Kita mahu main semula jika klik lagi.
                    // Tetapi untuk kesederhanaan, jika sedang main, kita hentikan dulu.
                    // Tapi pengguna mungkin klik berulang. Kita batalkan dan main baru.
                    // Hentikan semua bunyi yang sedang bermain dan reset.
                    stopAll();
                    // beri sedikit masa untuk reset sebelum main semula
                    setTimeout(() => {
                        playMelody();
                    }, 80);
                } else {
                    playMelody();
                }
            });

            // Pastikan audio context di resume jika diperlukan (autoplay policy)
            document.body.addEventListener('click', function once() {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                document.body.removeEventListener('click', once);
            }, { once: true });

        })();
    </script>
</body>
</html>
